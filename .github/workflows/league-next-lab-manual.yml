name: League Next Laboratory Manual

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe read-only or laboratory operation
        required: true
        type: choice
        options:
          - inspect
          - plan
          - provider-status
          - remote-provider-test
      season:
        description: Season
        required: true
        default: "2026"
      round:
        description: Optional Cartola round
        required: false
      laboratory_branch:
        description: Explicit laboratory branch
        required: true
        default: league-next-lab

concurrency:
  group: league-lab-${{ inputs.season }}-R${{ inputs.round || 'current' }}-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ inputs.operation == 'inspect' || inputs.operation == 'plan' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate laboratory branch
        env:
          LAB_BRANCH: ${{ inputs.laboratory_branch }}
        run: node scripts/league-workflow-guard.mjs "$LAB_BRANCH"
      - name: Produce read-only execution plan
        shell: bash
        run: node scripts/league-executor.mjs --${{ inputs.operation }} --season "${{ inputs.season }}" ${{ inputs.round && format('--round "{0}"', inputs.round) || '' }} --json --dry-run

  remote-lab:
    if: ${{ inputs.operation == 'provider-status' || inputs.operation == 'remote-provider-test' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate laboratory branch
        env:
          LAB_BRANCH: ${{ inputs.laboratory_branch }}
        run: node scripts/league-workflow-guard.mjs "$LAB_BRANCH"
      - name: GitHub provider laboratory operation
        env:
          GITHUB_TOKEN: ${{ secrets.LEAGUE_NEXT_LAB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          LEAGUE_GITHUB_BRANCH: ${{ inputs.laboratory_branch }}
          LEAGUE_OFFICIAL_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/github-storage-lab.mjs ${{ inputs.operation == 'provider-status' && '--status' || '--test-transaction' }}
