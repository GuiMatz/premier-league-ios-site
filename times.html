  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:oklch(.975 .008 250);--surface:oklch(.995 .003 250);--fg:oklch(.205 .055 258);--muted:oklch(.50 .025 255);--border:oklch(.89 .018 252);--accent:oklch(.54 .23 258);--navy:oklch(.18 .07 258);--navy-2:oklch(.25 .11 258);--accent-hi:oklch(.63 .22 253);--gold:oklch(.72 .14 83);--shadow:0 18px 50px oklch(.18 .06 258/.10);--shadow-soft:0 8px 28px oklch(.18 .06 258/.07);--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Manrope","Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;overflow-x:hidden;color:var(--fg);background:var(--bg);font:400 15px/1.55 var(--body)}body::before,body::after{content:"";position:fixed;z-index:-2;width:42vw;height:42vw;border-radius:50%;filter:blur(100px);opacity:.13;pointer-events:none}body::before{left:-23%;top:15%;background:var(--accent)}body::after{right:-25%;top:58%;background:var(--accent-hi)}button,a,input{font:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}img{display:block}.shell{width:min(1240px,calc(100% - 40px));margin:auto}h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;line-height:1.02;letter-spacing:-.02em}.site-header{position:sticky;top:0;z-index:50;color:white;background:oklch(.18 .07 258/.97);border-bottom:1px solid oklch(.98 0 0/.12);box-shadow:0 10px 32px oklch(.12 .05 258/.16)}.header-row{height:78px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:12px;color:white;text-decoration:none}.brand img{width:50px;height:50px;object-fit:contain}.brand strong{display:block;font:600 24px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}.brand small{display:block;margin-top:4px;color:oklch(.80 .035 250);font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}.desktop-nav{display:flex;justify-content:center;gap:2px}.desktop-nav a{min-height:44px;padding:0 10px;display:flex;align-items:center;color:oklch(.84 .025 250);border-radius:9px;text-decoration:none;font-size:10px;font-weight:600;letter-spacing:.065em;text-transform:uppercase}.desktop-nav a:hover,.desktop-nav a[aria-current="page"]{color:white;background:oklch(.98 0 0/.09)}.profile-button{min-height:48px;padding:5px 11px 5px 6px;display:flex;align-items:center;gap:9px;color:white;background:oklch(.98 0 0/.07);border:1px solid oklch(.98 0 0/.15);border-radius:14px;cursor:pointer}.profile-button img{width:35px;height:35px;object-fit:contain}.profile-button span{font-size:12px;font-weight:600}
    .context{padding:46px 0 24px;border-bottom:1px solid var(--border);display:flex;align-items:end;justify-content:space-between;gap:24px}.context h1{font-size:52px;text-transform:uppercase}.context p{max-width:54ch;margin:8px 0 0;color:var(--muted);font-size:13px}.context-meta{display:flex;gap:8px;align-items:center}.context-meta span{padding:8px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.tools{padding:24px 0 18px;display:flex;justify-content:space-between;align-items:center}.tools h2{font-size:30px;text-transform:uppercase}.search{position:relative;width:min(320px,100%)}.search input{width:100%;min-height:46px;padding:0 16px 0 42px;border:1px solid var(--border);border-radius:13px;color:var(--fg);background:var(--surface)}.search::before{content:"⌕";position:absolute;left:15px;top:8px;color:var(--muted);font:600 24px var(--display)}
    .club-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.club-card{--club:var(--accent);position:relative;isolation:isolate;overflow:hidden;min-height:292px;padding:22px 18px 18px;border:1px solid var(--border);border-top:4px solid var(--club);border-radius:22px;background:var(--surface);box-shadow:var(--shadow-soft);display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .18s,box-shadow .18s}.club-card::before{content:"";position:absolute;z-index:-1;left:50%;top:-90px;width:180px;height:180px;border-radius:50%;background:var(--club);opacity:.08;filter:blur(30px);transform:translateX(-50%)}.club-card:hover{transform:translateY(-5px);box-shadow:0 18px 40px oklch(.18 .06 258/.13)}.club-card.favorite{box-shadow:0 14px 36px oklch(.72 .14 83/.14);border-color:oklch(.72 .14 83/.45);border-top-color:var(--club)}.favorite-badge{position:absolute;top:13px;right:13px;padding:5px 7px;border-radius:999px;color:oklch(.35 .09 83);background:oklch(.94 .05 83);font-size:8px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}.crest-wrap{width:104px;height:104px;display:grid;place-items:center}.crest-wrap img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 12px 10px oklch(.18 .06 258/.14))}.club-card h3{min-height:44px;margin-top:10px;font-size:22px;text-transform:uppercase}.owner{color:var(--muted);font-size:9px}.owner b{color:var(--fg);font-weight:600}.club-stat{margin-top:auto;padding-top:17px;color:var(--muted);font-size:8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.club-stat strong{display:block;color:var(--fg);font:600 25px/1 var(--display);letter-spacing:-.01em}.club-link{min-height:44px;margin-top:13px;display:inline-flex;align-items:center;color:var(--fg);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:5px}.empty{grid-column:1/-1;padding:44px;text-align:center;color:var(--muted)}.page-note{margin:58px 0 100px;color:var(--muted);font-size:10px;text-align:center}.mobile-nav{display:none}
    @media(max-width:1100px){.desktop-nav{display:none}.header-row{grid-template-columns:1fr auto}.club-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){body{padding-bottom:76px}.shell{width:min(100% - 24px,660px)}.site-header{position:relative}.header-row{height:66px}.brand img{width:42px;height:42px}.brand strong{font-size:21px}.brand small,.profile-button span:not(:last-child){display:none}.context{padding:26px 0 18px;display:block}.context h1{font-size:42px}.context-meta{margin-top:16px}.tools{display:block}.search{margin-top:12px;width:100%}.club-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.club-card{min-height:252px;padding:16px 10px 13px;border-radius:18px}.crest-wrap{width:82px;height:82px}.crest-wrap img{width:74px;height:74px}.club-card h3{min-height:38px;font-size:18px}.favorite-badge{position:static;margin:-4px 0 5px}.club-stat{padding-top:11px}.club-link{margin-top:8px}.mobile-nav{position:fixed;display:grid;z-index:60;left:0;right:0;bottom:0;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:oklch(.18 .07 258/.98);border-top:1px solid oklch(.98 0 0/.12)}.mobile-nav a{min-height:52px;border-radius:9px;display:grid;place-items:center;color:oklch(.72 .03 250);font-size:8px;font-weight:600;text-decoration:none;text-transform:uppercase}.mobile-nav a[aria-current="page"]{color:white;background:oklch(.98 0 0/.09)}}
    @media(max-width:370px){.club-grid{grid-template-columns:1fr}.club-card{min-height:240px}}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>

<body>
  <header class="site-header" data-od-id="times-header"><div class="shell header-row"><a class="brand" href="home-page.html"><img src="assets/images/league-logo.png" alt="Logo Premier League IOS"><span><strong>Premier League IOS</strong><small>A maior liga do Cartola</small></span></a><nav class="desktop-nav" aria-label="Navegação principal"><a href="home-page.html">Início</a><a href="temporada-2026.html">Temporada</a><a href="rodadas.html">Rodadas</a><a href="escalacoes.html">Escalações</a><a href="times.html" aria-current="page">Times</a><a href="#estatisticas">Estatísticas</a><a href="#historia">História</a></nav><button class="profile-button" type="button" aria-label="Abrir perfil"><img src="assets/images/league-logo.png" alt="Logo da liga"><span id="profileName">Criar perfil</span><span aria-hidden="true">⌄</span></button></div></header>
  <main class="shell"><header class="context" data-od-id="teams-context"><div><h1>Times</h1><p>Identidade, temporada e títulos dos clubes da Premier League IOS.</p></div><div class="context-meta"><span>10 clubes atuais</span><span>2 históricos</span></div></header><section aria-labelledby="clubs-title"><div class="tools"><h2 id="clubs-title">Clubes atuais</h2><label class="search"><span class="sr-only">Buscar clube</span><input id="clubSearch" type="search" placeholder="Buscar clube" autocomplete="off"></label></div><div class="club-grid data-loading" id="clubGrid" aria-live="polite"></div></section><section class="other-teams section" id="otherTeams" aria-labelledby="otherTeamsTitle"></section><footer class="public-footer">© 2026 Premier League IOS.</footer></main>

  <script type="application/json" id="legacy-times-prototype-disabled">
    const A='assets/images/teams/';
    const teams=[
      {id:10000001,name:'Shaktar Meminetsk',short:'Meminetsk',owner:'Meminetsk',logo:A+'shaktar-meminetsk.png',color:'#f59e0b',titles:3,wins:65,games:93},
      {id:10000002,name:'INTER DE BIGÃO',short:'Inter de Bigão',owner:'Bigão',logo:A+'inter-de-bigao.png',color:'#2563eb',titles:2,wins:58,games:92},
      {id:10000003,name:'ValeGuiDoce Esporte Clube',short:'ValeGuiDoce',owner:'ValeGuiDoce',logo:A+'valeguidoce.png',color:'#ef4444',titles:4,wins:64,games:97},
      {id:10000004,name:'Rafa Casablanca Athletic',short:'Rafa Casablanca',owner:'Rafa Casa',logo:A+'rafa-casablanca.png',color:'#22c55e',titles:0,wins:56,games:95},
      {id:10000005,name:'Manteto United FC',short:'Manteto',owner:'Manteto',logo:A+'manteto.png',color:'#dc2626',titles:2,wins:53,games:94},

      {id:10000008,name:'Grishatasaray',short:'Grishatasaray',owner:'Grisha',logo:A+'grishatasaray.png',color:'#f97316',titles:0,wins:17,games:53},
      {id:10000009,name:'Paris Saint Zuis',short:'PS Zuis',owner:'Zuis',logo:A+'paris-saint-zuis.png',color:'#1d4ed8',titles:0,wins:21,games:61},

    const saved=(()=>{try{return JSON.parse(localStorage.getItem('pliosProfile')||localStorage.getItem('plios-profile')||'null')}catch{return null}})();let favoriteId=Number(saved?.favoriteTeamId)||10000003;if(saved?.name)document.getElementById('profileName').textContent=saved.name;
    const grid=document.getElementById('clubGrid');function render(filter=''){const list=teams.filter(t=>t.name.toLocaleLowerCase('pt-BR').includes(filter.toLocaleLowerCase('pt-BR')));grid.innerHTML=list.length?list.map(t=>{const fav=t.id===favoriteId,rate=(t.wins/t.games*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});return `<article class="club-card${fav?' favorite':''}" style="--club:${t.color}" data-od-id="club-card-${t.id}">${fav?'<span class="favorite-badge">★ Seu time</span>':''}<div class="crest-wrap"><img src="${t.logo}" alt="Escudo ${t.name}" onerror="this.hidden=true"></div><h3>${t.name}${fav?' <span aria-label="Seu time favorito">★</span>':''}</h3><div class="owner">Presidente · <b>${t.owner}</b></div><div class="club-stat"><strong>${t.titles?t.titles+' título'+(t.titles>1?'s':''):rate+'%'}</strong>${t.titles?'oficiais':'aproveitamento histórico'}</div><a class="club-link" href="clube.html?id=${t.id}" aria-label="Ver página do clube ${t.name}">Ver clube →</a></article>`}).join(''):'<div class="empty">Nenhum clube encontrado.</div>'}render();document.getElementById('clubSearch').addEventListener('input',e=>render(e.target.value));
  </script>
